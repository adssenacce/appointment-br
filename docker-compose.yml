version: '3.8'

services:
  banco_dados:
    image: postgres:15-alpine
    container_name: banco_dados_tenants
    environment:
      POSTGRES_USER: usuario_admin
      POSTGRES_PASSWORD: senha_segura_123
      POSTGRES_DB: db_tenants
    ports:
      - "5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario_admin -d db_tenants"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: api_tenants
    ports:
      - "8000:8000"
    environment:
      URL_BANCO_DADOS: postgresql://usuario_admin:senha_segura_123@banco_dados:5432/db_tenants
      CHAVE_SECRETA_JWT: sua_chave_secreta_muito_segura_aqui_mude_em_producao
      ALGORITMO_JWT: HS256
      MINUTAS_EXPIRACAO_TOKEN: 30
    depends_on:
      banco_dados:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn src.principal:aplicacao --host 0.0.0.0 --port 8000 --reload

volumes:
  dados_postgres:
